<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#00918B" />
    <title>Sem conexão — ZapcomIA</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family:
          Manrope,
          system-ui,
          -apple-system,
          sans-serif;
        background: #e0f8f5;
        color: #1f2937;
        text-align: center;
        padding: 24px;
      }
      .box {
        max-width: 360px;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 20px;
        opacity: 0.75;
        line-height: 1.5;
      }
      button {
        border: 0;
        border-radius: 9999px;
        background: #00918b;
        color: #fff;
        font: inherit;
        font-weight: 600;
        padding: 10px 24px;
        cursor: pointer;
      }
      button:hover {
        background: #007a75;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Você está offline</h1>
      <p>Sem conexão com a internet. Verifique sua rede e tente de novo.</p>
      <button onclick="location.reload()">Tentar novamente</button>
    </div>
  </body>
</html>
